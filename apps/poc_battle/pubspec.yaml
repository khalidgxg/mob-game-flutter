name: poc_battle
description: Proof of concept — the ported MobRush crowd simulation rendered with Flutter + Flame.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  mobrush_sim:
    path: ../../packages/mobrush_sim
  mobrush_data:
    path: ../../packages/mobrush_data
  mobrush_save:
    path: ../../packages/mobrush_save
  shared_preferences: ^2.3.2
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/crowd_export/
    - assets/structures/stage1/
    - assets/structures/stage2/
    - assets/structures/stage3/
    - assets/structures/gate/
    - assets/home/
    - assets/home/icons/
    - assets/home/design/
    - assets/campaign/
    - assets/content/
    - assets/ground/
    - assets/audio/sfx/
    - assets/audio/music/
