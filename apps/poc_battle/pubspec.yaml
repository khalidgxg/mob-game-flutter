name: poc_battle
description: Proof of concept — the ported MobRush crowd simulation rendered with Flutter + Flame.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  mobrush_sim:
    path: ../../packages/mobrush_sim

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/crowd_export/
